apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-service-account
  namespace: default
  labels:
    app: workload-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-monitor-role
  labels:
    app: workload-app
rules:
  # Read-only access to core cluster resources
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # Read-only access to deployment workload status
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Read-only access to Metrics Server API
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workload-monitor-rolebinding
  labels:
    app: workload-app
subjects:
  - kind: ServiceAccount
    name: workload-service-account
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-monitor-role
